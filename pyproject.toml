[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ed_ops"
version = "0.1.0"
description = "ED crowding command center: synthetic ED patient-flow simulator and streaming medallion pipeline"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "dbldatagen>=0.4.0",
  "pyyaml>=6.0",
  "jmespath>=1.0",
  "pyparsing>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.2", "numpy>=1.26", "pyarrow>=15.0", "databricks-sdk>=0.60", "fastapi>=0.115", "httpx>=0.27", "psycopg[binary,pool]>=3.2"]

[project.scripts]
ed-ops-create-objects = "ed_ops.cli:create_objects"
ed-ops-seed-reference = "ed_ops.cli:seed_reference"
ed-ops-backfill-generate = "ed_ops.cli:backfill_generate"
ed-ops-backfill-ingest = "ed_ops.cli:backfill_ingest"
ed-ops-backfill-gold = "ed_ops.cli:backfill_gold"
ed-ops-stream-generator = "ed_ops.cli:stream_generator"
ed-ops-stream-bronze = "ed_ops.cli:stream_bronze"
ed-ops-stream-silver-visits = "ed_ops.cli:stream_silver_visits"
ed-ops-stream-gold-metrics = "ed_ops.cli:stream_gold_metrics"
ed-ops-backfill-notes-ai = "ed_ops.cli:backfill_notes_ai"
ed-ops-refresh-drivers = "ed_ops.cli:refresh_drivers"
ed-ops-backfill-narratives = "ed_ops.cli:backfill_narratives"
ed-ops-governance-checks = "ed_ops.cli:governance_checks"
ed-ops-stream-notes-ai = "ed_ops.cli:stream_notes_ai"
ed-ops-stream-ai-retry = "ed_ops.cli:stream_ai_retry"
ed-ops-stream-narratives = "ed_ops.cli:stream_narratives"
ed-ops-validate-golden = "ed_ops.cli:validate_golden"
ed-ops-validate-pipeline = "ed_ops.cli:validate_pipeline"
ed-ops-teardown-schemas = "ed_ops.cli:teardown_schemas"
ed-ops-serving-setup = "ed_ops.cli:serving_setup"
ed-ops-genie-space = "ed_ops.cli:genie_space"
ed-ops-genie-benchmarks = "ed_ops.cli:genie_benchmarks"

[tool.hatch.build.targets.wheel]
packages = ["src/ed_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
