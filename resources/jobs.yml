resources:
  jobs:
    ed_setup:
      name: ed-ops setup
      description: >-
        One-off, idempotent setup: DDL with comments and tags, reference data, patient population,
        14-day patient-journey backfill, and bronze/silver/gold history.
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
              - databricks-sdk>=0.164.0
      tasks:
        - task_key: create_objects
          environment_key: default
          python_wheel_task:
            package_name: ed_ops
            entry_point: ed-ops-create-objects
            named_parameters: &common
              catalog: ${var.catalog}
              schema_prefix: ${var.schema_prefix}
              facility_count: ${var.facility_count}
              backfill_days: ${var.backfill_days}
              tick_seconds: ${var.tick_seconds}
              timezone: ${var.timezone}
              seed: ${var.seed}
              checkpoint_version: ${var.checkpoint_version}
              secret_scope: ${var.secret_scope}
              tag_prefix: ${var.tag_prefix}
              ai_backfill_days: ${var.ai_backfill_days}
              llm_endpoint: ${var.llm_endpoint}
              narrative_minutes: ${var.narrative_minutes}
              ai_retry_minutes: ${var.ai_retry_minutes}
              warehouse_id: ${var.warehouse_id}
              lakebase_project_id: ${var.lakebase_project_id}
              lakebase_branch: ${var.lakebase_branch}
              lakebase_database: ${var.lakebase_database}
              sync_mode_live: ${var.sync_mode_live}
              sync_mode_ref: ${var.sync_mode_ref}
              app_name: ${resources.apps.ed_ops.name}
              genie_space_title: ${var.genie_space_title}
        - task_key: seed_reference
          depends_on: [{task_key: create_objects}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-seed-reference, named_parameters: *common}
        - task_key: backfill_generate
          depends_on: [{task_key: seed_reference}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-backfill-generate, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: backfill_ingest
          depends_on: [{task_key: backfill_generate}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-backfill-ingest, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: backfill_gold
          depends_on: [{task_key: backfill_notes_ai}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-backfill-gold, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: backfill_notes_ai
          depends_on: [{task_key: backfill_ingest}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-backfill-notes-ai, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: refresh_drivers
          depends_on: [{task_key: backfill_gold}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-refresh-drivers, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: backfill_narratives
          depends_on: [{task_key: refresh_drivers}, {task_key: backfill_notes_ai}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-backfill-narratives, named_parameters: {<<: *common, streaming_job_id: "${resources.jobs.ed_streaming.id}"}}
        - task_key: governance_checks
          depends_on: [{task_key: backfill_narratives}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-governance-checks, named_parameters: *common}
        - task_key: serving_setup
          depends_on: [{task_key: governance_checks}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-serving-setup, named_parameters: *common}
        - task_key: genie_space
          depends_on: [{task_key: serving_setup}]
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-genie-space, named_parameters: *common}

    ed_streaming:
      name: ed-ops streaming
      description: >-
        Always-on simulator and medallion streams on a classic on-demand Photon DBR 18 LTS standard-access cluster (Graviton r7gd):
        generator -> landing volume -> bronze (Auto Loader) -> silver visits -> gold crowding metrics.
      continuous:
        pause_status: ${var.streaming_pause_status}
      job_clusters:
        - job_cluster_key: streaming
          new_cluster:
            spark_version: 18.x-scala2.13
            runtime_engine: PHOTON
            node_type_id: ${var.streaming_node_type}
            driver_node_type_id: ${var.streaming_node_type}
            num_workers: 1
            data_security_mode: USER_ISOLATION
            aws_attributes:
              availability: ON_DEMAND
              first_on_demand: 1
            spark_conf:
              spark.sql.session.timeZone: UTC
            custom_tags:
              project: ed-ops
      tasks:
        - task_key: generator
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-generator, named_parameters: *common}
        - task_key: bronze_ingest
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-bronze, named_parameters: *common}
        - task_key: silver_visits
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-silver-visits, named_parameters: *common}
        - task_key: gold_metrics
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-gold-metrics, named_parameters: *common}
        - task_key: notes_ai
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-notes-ai, named_parameters: *common}
        - task_key: ai_retry
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-ai-retry, named_parameters: *common}
        - task_key: narratives
          job_cluster_key: streaming
          libraries: [{whl: ../dist/*.whl}]
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-stream-narratives, named_parameters: *common}

    ed_genie_benchmarks:
      name: ed-ops genie benchmarks
      description: Asks every benchmark question through the Genie Conversation API and compares with the expected SQL.
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
              - databricks-sdk>=0.164.0
      tasks:
        - task_key: genie_benchmarks
          environment_key: default
          python_wheel_task: {package_name: ed_ops, entry_point: ed-ops-genie-benchmarks, named_parameters: *common}
