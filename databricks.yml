bundle:
  name: ed-ops

include:
  - resources/*.yml

sync:
  include:
    - app/frontend/dist/**

artifacts:
  ed_ops_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: Existing Unity Catalog catalog. The bundle never creates or drops a catalog.
    default: hls_jagjit_lb_playground_catalog
  schema_prefix:
    description: Prefix of every schema the solution creates ({prefix}bronze, {prefix}silver, ...).
    default: ed_
  facility_count:
    description: Number of simulated emergency departments.
    default: "50"
  backfill_days:
    description: Days of simulated history generated by ed_setup.
    default: "14"
  tick_seconds:
    description: Generator tick interval in seconds (multiple of 60).
    default: "60"
  timezone:
    description: Local time zone of the health system.
    default: America/Chicago
  seed:
    description: Simulator random seed.
    default: "42"
  checkpoint_version:
    description: Bump to give every stream a fresh checkpoint.
    default: "1"
  secret_scope:
    description: Secret scope that holds the MRN hashing salt.
    default: ed_ops
  tag_prefix:
    description: Prefix for Unity Catalog tag keys (ed_layer, ed_data_classification, ...); avoids clashing with existing governed tag policies. Empty uses the bare spec names.
    default: ed_
  ai_backfill_days:
    description: Triage notes newer than this many days get the full AI chain; older backfill notes are stored without text.
    default: "2"
  llm_endpoint:
    description: Model serving endpoint for ai_query (ESI suggestions and narratives).
    default: databricks-claude-sonnet-5-5
  narrative_minutes:
    description: Minutes between narrative refreshes.
    default: "15"
  ai_retry_minutes:
    description: Minutes between AI retry sweeps.
    default: "15"
  warehouse_id:
    description: SQL warehouse for Genie and the app (required for every target).
    default: ""
  lakebase_project_id:
    description: Lakebase Autoscaling project id (lowercase letters, digits, hyphens).
    default: ed-ops-${bundle.target}
  lakebase_branch:
    description: Lakebase branch serving the app.
    default: production
  lakebase_database:
    description: Postgres database holding the synced tables.
    default: databricks_postgres
  sync_mode_live:
    description: Sync mode for live gold tables (CONTINUOUS or TRIGGERED).
    default: CONTINUOUS
  sync_mode_ref:
    description: Sync mode for reference tables.
    default: SNAPSHOT
  app_name:
    description: Databricks App name.
    default: ed-ops-${bundle.target}
  genie_space_title:
    description: Title of the Genie space (the app finds the space by this title).
    default: ED Ops Crowding Assistant (${bundle.target})
  run_as_service_principal:
    description: Application id of the service principal that runs the jobs in the customer target.
    default: ""
  streaming_node_type:
    description: Node type of the classic streaming job cluster (Graviton; on-demand, Photon).
    default: r7gd.2xlarge
  streaming_pause_status:
    description: PAUSED or UNPAUSED for the continuous ed_streaming job.
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-jagjit-lb-playground.cloud.databricks.com
    variables:
      secret_scope: ed_ops_${workspace.current_user.short_name}
      warehouse_id: abef38163a09f120
  customer:
    # Template for the customer workspace: authenticate with a CLI profile for that workspace and pass
    # --var catalog=<existing catalog> --var warehouse_id=<warehouse> --var run_as_service_principal=<application id>.
    mode: production
    run_as:
      service_principal_name: ${var.run_as_service_principal}
